AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  booking-villa-backend
  SAM Template for booking-villa-backend

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE: booking-villa-backend
    Tracing: Active
  Api:
    TracingEnabled: True
    BinaryMediaTypes:
      - "*/*"

Resources:
  # API Gateway
  BookingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Function
  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 15
      Events:
        # Auth endpoints
        UserLogin:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/login
            Method: POST
        UserMe:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/me
            Method: GET
        SendOTP:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/send-otp
            Method: POST
        VerifyOTP:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/verify-otp
            Method: POST

        # User endpoints
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users/{phone}
            Method: PATCH

        # Property endpoints
        CreateProperty:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties
            Method: POST
        GetProperty:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{id}
            Method: GET
        ListProperties:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties
            Method: GET
        GenerateInviteCode:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{id}/invite-codes
            Method: POST
        ListInviteCodes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{id}/invite-codes
            Method: GET
        ValidateInviteCode:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /invite-codes/validate
            Method: POST

        # Booking endpoints
        CreateBooking:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings
            Method: POST
        GetBooking:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{id}
            Method: GET
        ListBookings:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings
            Method: GET
        UpdateBookingStatus:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{id}/status
            Method: PATCH
        SettleBooking:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{id}/settle
            Method: POST
        EditBooking:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{id}
            Method: PATCH
        CheckAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{id}/availability
            Method: GET
        GetPropertyCalendar:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{id}/calendar
            Method: GET
        ListAvailableProperties:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/available
            Method: GET

        # Payment endpoints
        GetPaymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{id}/payment-status
            Method: GET

        # Analytics endpoints (Proxy)
        AnalyticsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics/{proxy+}
            Method: ANY
        AnalyticsBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics
            Method: ANY

        # Notification endpoints
        ListNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications
            Method: GET
        MarkNotificationRead:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications/{id}/read
            Method: PATCH
        MarkAllNotificationsRead:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications/mark-all-read
            Method: POST
        GetUnreadCount:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications/count
            Method: GET

  # DynamoDB Table
  BookingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: booking-villa-backend
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: Hash
        - AttributeName: SK
          KeyType: Range
      BillingMode: PAY_PER_REQUEST

Outputs:
  BookingApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
