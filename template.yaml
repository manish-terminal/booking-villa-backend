AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: booking-villa-backend refined template

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE: booking-villa-backend

Resources:
  BookingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - "application/octet-stream"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - arm64
      Events:
        AuthRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/{proxy+}
            Method: ANY
        UserRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users/{proxy+}
            Method: ANY
        UserBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users
            Method: ANY
        PropertyRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{proxy+}
            Method: ANY
        PropertyBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties
            Method: ANY
        BookingRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{proxy+}
            Method: ANY
        BookingBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings
            Method: ANY
        AnalyticsRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics/{proxy+}
            Method: ANY
        AnalyticsBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics
            Method: ANY
        NotificationRoutes:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications/{proxy+}
            Method: ANY
        NotificationBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications
            Method: ANY

  BookingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: booking-villa-backend
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Outputs:
  BookingApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
