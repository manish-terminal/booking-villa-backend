AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: booking-villa-backend consolidated template

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        DYNAMODB_TABLE: booking-villa-backend
    Tracing: Active
  Api:
    TracingEnabled: True
    BinaryMediaTypes:
      - "*/*"

Resources:
  BookingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - "*/*"

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Events:
        # Consolidated Proxy Routes to minimize Lambda Resource Policy size
        AuthProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /auth/{proxy+}
            Method: ANY
        UserProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users/{proxy+}
            Method: ANY
        UsersBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /users
            Method: ANY
        PropertyProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties/{proxy+}
            Method: ANY
        PropertiesBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /properties
            Method: ANY
        BookingProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings/{proxy+}
            Method: ANY
        BookingsBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /bookings
            Method: ANY
        AnalyticsProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics/{proxy+}
            Method: ANY
        AnalyticsBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /analytics
            Method: ANY
        NotificationProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications/{proxy+}
            Method: ANY
        NotificationsBase:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /notifications
            Method: ANY
        MiscProxy:
          Type: Api
          Properties:
            RestApiId: !Ref BookingApi
            Path: /{proxy+}
            Method: ANY

  BookingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: booking-villa-backend
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Outputs:
  BookingApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
